# Nav2 Controller Server: DWB 全向控制器 + 内部 local costmap
controller_server:
  ros__parameters:
    controller_frequency: 10.0   # Orange Pi 性能适配 (20Hz 跑不满)
    controller_plugins: ["FollowPath"]

    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: false
      min_vel_x: 0.0
      max_vel_x: 1.0             # 降低最高速, 先保证避障效果
      min_vel_y: -0.5
      max_vel_y: 0.5
      max_vel_theta: 0.5
      min_speed_xy: 0.0
      max_speed_xy: 1.0
      min_speed_theta: 0.0
      acc_lim_x: 1.0
      acc_lim_y: 1.0
      acc_lim_theta: 0.5
      holonomic_robot: true
      vx_samples: 10             # 减少采样数, 降低 CPU 负载
      vy_samples: 10
      vtheta_samples: 20
      sim_time: 1.2              # 缩短仿真时间
      linear_granularity: 0.08
      angular_granularity: 0.04
      transform_tolerance: 0.3   # 放宽 TF 容差

      critics: ["RotateToGoal", "Oscillation", "ObstacleFootprint",
                "GoalAlign", "PathAlign", "PathDist", "GoalDist"]

      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      PathAlign.scale: 32.0
      GoalAlign.scale: 24.0
      ObstacleFootprint.scale: 0.5
      RotateToGoal.scale: 0.0
      Oscillation.scale: 0.1

      footprint: "[[-0.17, -0.17], [-0.17, 0.17], [0.17, 0.17], [0.17, -0.17]]"
      footprint_padding: 0.02

    # ------ 内部 local costmap ------
    local_costmap:
      ros__parameters:
        global_frame: odom
        robot_base_frame: base_link
        update_frequency: 5.0
        publish_frequency: 2.0
        resolution: 0.05
        width: 4.0
        height: 4.0
        origin_x: -2.0
        origin_y: -2.0
        rolling_window: true
        always_send_full_costmap: false

        plugins: ["obstacle_layer", "inflation_layer"]

        obstacle_layer:
          plugin: "nav2_costmap_2d::ObstacleLayer"
          enabled: true
          observation_sources: scan
          scan:
            topic: /scan
            max_obstacle_height: 2.0
            min_obstacle_height: -0.5
            obstacle_range: 10.0
            raytrace_range: 12.0
            clearing: true
            marking: true
            data_type: "LaserScan"

        inflation_layer:
          plugin: "nav2_costmap_2d::InflationLayer"
          enabled: true
          cost_scaling_factor: 3.0
          inflation_radius: 0.3
